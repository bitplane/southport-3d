<!doctype html><html lang="en"><meta charset="utf-8"><title>Building LoD comparison</title>
<style>body{margin:0;background:#b8c5cc;font:14px system-ui}canvas{display:block}header{position:absolute;top:12px;left:12px;background:#fffeeef2;padding:12px;border-radius:6px;max-width:680px}select,button{font:inherit;margin:3px;padding:5px}p{margin:6px 0}#stats{font-variant-numeric:tabular-nums}#error{color:#a00}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<header><strong>Building LoD comparison</strong><p>Switch models without moving the camera. Drag to orbit, scroll to zoom.</p><select id="variant"></select><select id="view"></select><button id="distance">70 m from target</button><label><input id="wire" type="checkbox">Wireframe</label><label><input id="normals" type="checkbox" checked>Normal maps</label><p id="stats"></p><p id="error"></p><a href="/">Back to town</a></header>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,2000),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xb8c5cc);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;
scene.background=new THREE.Color(0xb8c5cc);scene.add(new THREE.HemisphereLight(0xddeeff,0x68604b,2));const sun=new THREE.DirectionalLight(0xfff6e5,3);sun.position.set(-20,90,60);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshStandardMaterial({color:0x9c9c91,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=.3;scene.add(ground);
const variants=await(await fetch('variants.json')).json(),views=await(await fetch('views.json')).json(),cache=new Map(),loader=new GLTFLoader();let active=null,request=0;
for(const name of Object.keys(variants))$('variant').add(new Option(name,name));for(const v of views)$('view').add(new Option(v.name,v.name));
function setView(v){if(v.name)$('view').value=v.name;camera.position.fromArray(v.position);orbit.target.fromArray(v.target);orbit.update();}
function materials(){active?.traverse(o=>{if(o.isMesh)for(const m of Array.isArray(o.material)?o.material:[o.material]){m.wireframe=$('wire').checked;if(m.userData.originalNormal===undefined)m.userData.originalNormal=m.normalMap;m.normalMap=$('normals').checked?m.userData.originalNormal:null;m.needsUpdate=true;}});}
async function show(name){const ticket=++request;$('stats').textContent='Loading '+name;try{let root=cache.get(name);if(!root){root=new THREE.Group();for(const f of variants[name].files){const g=await loader.loadAsync(f);g.scene.traverse(o=>{if(o.isMesh)for(const m of Array.isArray(o.material)?o.material:[o.material])for(const value of Object.values(m))if(value?.isTexture)value.anisotropy=Math.min(16,renderer.capabilities.getMaxAnisotropy());});root.add(g.scene);}cache.set(name,root);}if(ticket!==request)return;if(active)scene.remove(active);active=root;scene.add(root);materials();const v=variants[name];$('stats').textContent=`${name}: ${v.triangles.toLocaleString()} triangles · ${(v.bytes/1000).toFixed(0)} KB download · ${(v.gpuBytesEstimate/1048576).toFixed(2)} MiB estimated GPU`;window.reviewState={name,...v};}catch(e){$('error').textContent=String(e);throw e;}}
$('variant').onchange=()=>show($('variant').value);$('view').onchange=()=>setView(views.find(v=>v.name===$('view').value));$('wire').onchange=materials;$('normals').onchange=materials;$('distance').onclick=()=>{const v=views.find(v=>v.name==='Front')||views[0],d=new THREE.Vector3().fromArray(v.position).sub(new THREE.Vector3().fromArray(v.target)).normalize().multiplyScalar(70);setView({position:d.add(new THREE.Vector3().fromArray(v.target)).toArray(),target:v.target});};
$('variant').value='New District';setView(views[0]);await show('New District');window.review={show:async name=>{$('variant').value=name;await show(name);},view:name=>setView(views.find(v=>v.name===name)),setView,silhouette:enabled=>{scene.overrideMaterial=enabled?new THREE.MeshBasicMaterial({color:0,side:THREE.DoubleSide}):null;ground.visible=!enabled;scene.background=new THREE.Color(enabled?0xffffff:0xb8c5cc);},position:()=>({camera:camera.position.toArray(),target:orbit.target.toArray()})};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});renderer.setAnimationLoop(()=>{orbit.update();renderer.render(scene,camera);});
</script></html>
