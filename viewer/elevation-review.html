<!doctype html><html lang="en"><meta charset="utf-8"><title>Southport elevation review</title>
<style>body{margin:0;font:14px system-ui;background:#b9ccd6}canvas{display:block}header{position:absolute;left:12px;top:12px;background:#fffef2ed;padding:14px;max-width:530px;border-radius:6px}p{margin:6px 0}button,select{font:inherit;padding:4px;margin:3px}#readout{font-variant-numeric:tabular-nums}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<header><strong>Measured terrain — migration review</strong><p>EA 1 m bare-earth reference, displayed on a 5 m mesh. Water and removed structures may be interpolated. This is not the corrected town scene.</p>
<select id="view"><option>Whole map</option><option>Nevill Street</option><option>Funland</option><option>Marine Way Bridge</option><option>Venetian bridge</option></select>
<label><input id="models" type="checkbox">Migrated region packages</label><label><input id="old" type="checkbox">Published ground samples</label><label><input id="wire" type="checkbox">Wireframe</label>
<p>Height scale: <select id="scale"><option value="1">1× actual</option><option value="5">5× diagnostic</option><option value="10">10× diagnostic</option></select></p>
<p id="datum"></p><p id="readout">Move the pointer over the terrain to inspect height.</p><a href="/">Back to town</a></header>
<script type="module">
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),scene=new T.Scene(),camera=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,10000),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0xb9ccd6);document.body.append(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;
scene.add(new T.HemisphereLight(0xffffff,0x495544,2));const sun=new T.DirectionalLight(0xffffff,2.5);sun.position.set(-800,1200,500);scene.add(sun);
const data=await(await fetch('review.json')).json();$('datum').textContent=`Local zero ≈ ${data.localZeroODN.toFixed(3)} m ODN; provisional memorial road tie.`;
const positions=new Float32Array(await(await fetch('terrain.bin')).arrayBuffer()),indices=[];for(let j=0;j<data.rows-1;j++)for(let i=0;i<data.columns-1;i++){const a=j*data.columns+i,b=a+1,c=a+data.columns,d=c+1;indices.push(a,b,c,b,d,c);}
const colours=new Float32Array(positions.length);for(let i=0;i<positions.length;i+=3){const z=positions[i+1],colour=new T.Color().setHSL(.34-Math.min(1,Math.max(0,(z+3)/9))*.25,.3,.46);colour.toArray(colours,i);}
const geom=new T.BufferGeometry();geom.setAttribute('position',new T.BufferAttribute(positions,3));geom.setAttribute('color',new T.BufferAttribute(colours,3));geom.setIndex(indices);geom.computeVertexNormals();const mesh=new T.Mesh(geom,new T.MeshStandardMaterial({vertexColors:true,roughness:1,side:T.DoubleSide}));scene.add(mesh);
const oldPositions=new Float32Array(await(await fetch('published-ground.bin')).arrayBuffer()),oldGeom=new T.BufferGeometry();oldGeom.setAttribute('position',new T.BufferAttribute(oldPositions,3));const old=new T.Points(oldGeom,new T.PointsMaterial({color:0xb22961,size:1,sizeAttenuation:true}));old.visible=false;scene.add(old);
const roadGeom=new T.BufferGeometry();roadGeom.setAttribute('position',new T.BufferAttribute(new Float32Array(await(await fetch('road-guides.bin')).arrayBuffer()),3));const roads=new T.LineSegments(roadGeom,new T.LineBasicMaterial({color:0x283c45,depthTest:false,transparent:true,opacity:.6}));scene.add(roads);
const yaw=43.5293*Math.PI/180,c=Math.cos(yaw),s=Math.sin(yaw);function world(x,y,z){return [c*x-s*y,z,-(s*x+c*y)];}
const views={'London Square':{position:world(190,-225,170),target:world(30,-35,0)},'Glebe Place':{position:world(-70,-100,45),target:world(-27,-62,1)},'Hoghton Street':{position:world(450,-470,230),target:world(290,-150,0)},'Chapel Street':{position:world(-120,-330,130),target:world(-120,-140,0)},'Whole map':{position:[900,1600,1300],target:[-250,0,-500]},'Nevill Street':{position:world(-110,120,75),target:world(0,155,1)},'Funland':{position:world(-95,390,45),target:world(0,330,0)},'Marine Way Bridge':{position:world(-130,450,65),target:world(-15,435,0)},'Venetian bridge':{position:world(-390,440,50),target:world(-290,400,0)}};
for(const name of ['London Square','Glebe Place','Hoghton Street','Chapel Street'])$('view').add(new Option(name,name));
const models=new T.Group();models.rotation.y=yaw;scene.add(models);models.visible=false;let loadedModels=false;
$('models').onchange=async()=>{models.visible=$('models').checked;mesh.visible=!models.visible;roads.visible=!models.visible;if(models.visible&&!loadedModels){loadedModels=true;const loader=new GLTFLoader(),files=await(await fetch('models.json')).json();try{for(const file of files){const gltf=await loader.loadAsync(file);models.add(gltf.scene);}}catch(e){$('readout').textContent='Package load failed: '+e.message;loadedModels=false;}}};
function view(name){const v=views[name];$('view').value=name;camera.position.fromArray(v.position);orbit.target.fromArray(v.target);orbit.update();}view('Whole map');$('view').onchange=()=>view($('view').value);$('old').onchange=()=>old.visible=$('old').checked;$('wire').onchange=()=>mesh.material.wireframe=$('wire').checked;$('scale').onchange=()=>{models.scale.y=mesh.scale.y=old.scale.y=roads.scale.y=Number($('scale').value);};
const ray=new T.Raycaster();renderer.domElement.addEventListener('pointermove',e=>{ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2),camera);const hit=ray.intersectObject(mesh)[0];if(hit){const h=hit.point.y/mesh.scale.y;$('readout').textContent=`Ground ${h.toFixed(2)} m local / ${(h+data.localZeroODN).toFixed(2)} m ODN`;}});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});renderer.setAnimationLoop(()=>{orbit.update();renderer.render(scene,camera);});window.elevationReview={view,camera,orbit,mesh,old,models};
</script></html>
